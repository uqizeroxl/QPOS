<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menghubungkan TikTok...</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; color: #374151; }
    .loader { width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const errorParam = params.get('error');
      const savedState = sessionStorage.getItem('tiktok_oauth_state');
      sessionStorage.removeItem('tiktok_oauth_state');

      if (errorParam) {
        window.opener && window.opener.postMessage({ type: 'tiktok_oauth', error: errorParam }, window.location.origin);
      } else if (!code) {
        window.opener && window.opener.postMessage({ type: 'tiktok_oauth', error: 'Tidak ada kode otorisasi.' }, window.location.origin);
      } else if (state && savedState && state !== savedState) {
        window.opener && window.opener.postMessage({ type: 'tiktok_oauth', error: 'Keamanan: state mismatch.' }, window.location.origin);
      } else {
        window.opener && window.opener.postMessage({ type: 'tiktok_oauth', code: code }, window.location.origin);
      }

      window.close();
    })();
  </script>
</body>
</html>
