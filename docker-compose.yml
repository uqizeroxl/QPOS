services:
  qpos-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qpos-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET:-qpos-secret-change-in-production}
      - DATABASE_PATH=/app/data/qpos.db
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - qpos-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  qpos-data: